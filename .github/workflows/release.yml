name: Release desktop apps

# Prepared locally only. A future push to release will build and publish a new version.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'jiunkong/TorchLauncher' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - id: version
        run: node scripts/release.mjs version
      - name: Refuse existing tags or releases
        run: node scripts/release.mjs preflight
        env:
          GH_TOKEN: ${{ github.token }}

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            builder-platform: win
            target: portable
          - os: ubuntu-22.04
            platform: linux
            builder-platform: linux
            target: AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package launcher and Studio (x64, unsigned, no builder publishing)
        run: |
          pnpm --filter @torchlauncher/launcher exec electron-builder --config electron-builder.config.cjs --${{ matrix.builder-platform }} ${{ matrix.target }} --x64 --publish never
          pnpm --filter @torchlauncher/studio exec electron-builder --config electron-builder.config.cjs --${{ matrix.builder-platform }} ${{ matrix.target }} --x64 --publish never
      - name: Stage only the expected executables
        run: node scripts/release.mjs stage ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}-x64
          path: .cache/release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: true

  publish:
    needs: [prepare, package]
    if: github.repository == 'jiunkong/TorchLauncher' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_REPO: jiunkong/TorchLauncher
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*-x64
          merge-multiple: true
          path: .cache/release-assets
      - name: Validate all four binaries and generate SHA-256 metadata
        run: node scripts/release.mjs metadata
      - name: Recheck version before creating a draft
        run: node scripts/release.mjs preflight
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create draft for this exact commit and upload verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          gh release create "$RELEASE_TAG" --verify-tag --target "$GITHUB_SHA" --draft --title "TorchLauncher $RELEASE_VERSION" --generate-notes
          gh release upload "$RELEASE_TAG" .cache/release-assets/*
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > .cache/remote-release.json
          node scripts/release.mjs verify
      - name: Publish complete stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
