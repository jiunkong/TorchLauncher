name: Check and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm smoke
      - name: Smoke test (Windows)
        if: runner.os != 'Linux'
        run: pnpm smoke
      - name: Package portable apps
        if: github.event_name == 'workflow_dispatch'
        run: |
          pnpm package:launcher
          pnpm package:studio
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: torchlauncher-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            apps/*/dist/*.exe
            apps/*/dist/*.zip
            apps/*/dist/*.tar.gz
