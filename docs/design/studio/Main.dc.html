<style>
body{margin:0;background:#0e0b0c}
.hero{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(640px 420px at 50% 22%,rgba(255,90,50,.18),transparent 66%),#0e0b0c}
.inner{width:880px;display:flex;flex-direction:column;gap:30px;position:relative}
.head{display:flex;align-items:center;gap:18px}
.head img{width:72px;height:72px}
.head h1{margin:0;font-family:'Pixelify Sans','Noto Sans KR',sans-serif;font-size:36px;line-height:1.1;letter-spacing:.05em}
.head h1 i{font-style:normal;color:#ff6a55}
.head h1 s{text-decoration:none;font-family:'Silkscreen',monospace;font-size:13px;letter-spacing:.3em;color:#ff6a55;border:1px solid rgba(255,106,85,.5);border-radius:4px;padding:2px 8px;margin-left:12px;vertical-align:middle}
.head p{margin:6px 0 0;color:var(--text-2);font-size:14px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.big{display:flex;gap:16px;align-items:center;padding:22px;border-radius:14px;background:var(--panel);border:1px solid var(--line-2);text-decoration:none;color:var(--text)}
.big:hover{background:var(--panel-2)}
.big.p{background:linear-gradient(135deg,rgba(229,65,43,.22),rgba(229,65,43,.06));border-color:rgba(229,65,43,.6)}
.big .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.07);flex:none}
.big svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.big strong{display:block;font-size:17px}
.big small{display:block;color:var(--text-2);font-size:13px}
.rec h2{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--text-3);letter-spacing:.04em}
.rr{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;text-decoration:none;color:var(--text);border:1px solid transparent}
.rr:hover{background:var(--panel);border-color:var(--line)}
.rr .ri{width:38px;height:38px;border-radius:8px;background:var(--panel-2);display:grid;place-items:center;flex:none}
.rr .ri img{width:28px;height:28px}
.rr strong{display:block;font-size:14px;font-weight:500;line-height:1.35}
.rr small{display:block;font-size:12px;color:var(--text-3);line-height:1.35}
.rr .g{flex:1;min-width:0}
.rr time{font-size:12px;color:var(--text-3)}
</style>
