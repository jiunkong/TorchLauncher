<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이전 실행 확인</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="launcher.css">
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="states.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Pixelify+Sans:wght@500;700&family=Silkscreen:wght@400;700&display=swap">
<style>body{margin:0;background:#0e0b0c}.win{position:relative}.scrim{position:absolute;left:0;right:0;top:36px;bottom:0;background:rgba(6,4,5,.72);display:grid;place-items:center}.dialog{width:500px;background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.6)}.dialog h2{margin:0 0 8px;font-size:20px}.check{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2);font-size:13px}.box{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--text-3);flex:none}</style>
</helmet>
<div class="win">
  <div class="titlebar">
    <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M8 1l6 5-6 9-6-9z" fill="#3aa8e0"/><path d="M8 1l6 5H2z" fill="#8fe0ff"/><path d="M8 6l6 0-6 9z" fill="#2478b8"/></svg>
    <span>서버 이름</span>
    <span class="spacer"></span>
    <button class="wc" type="button" aria-label="최소화"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="wc" type="button" aria-label="최대화"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/></svg></button>
    <button class="wc close" type="button" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="shell">
    <nav class="rail" aria-label="런처 메뉴">
      <span class="ri"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span>
      <span class="sep"></span>
      <span class="ri active"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></span>
      <span class="ri"><svg viewBox="0 0 24 24"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/></svg></span>
      <span class="ri"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></span>
      <span class="ri"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg></span>
      <span class="sp"></span>
      <span class="avatar">J</span>
    </nav>
    <section class="stage-home" aria-hidden="true">
      <div class="scene sample"><span class="sun"></span><span class="hill h1"></span><span class="hill h2"></span></div>
      <div class="shade"></div>
    </section>
  </div>
  <div class="scrim">
    <div class="dialog" role="dialog" aria-labelledby="dlg-title" aria-modal="true">
      <h2 id="dlg-title">이전 실행이 정상적으로 끝나지 않았습니다</h2>
      <p style="margin: 0; font-size: 13px; color: var(--text-2)">게임이나 런처가 갑자기 종료되어 정리가 필요합니다.</p>
      <div class="check"><span class="box"></span><span>실행 중인 게임이나 런처가 없음을 확인했습니다.</span></div>
      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px">
        <button class="btn" type="button">나중에</button>
        <button class="btn primary" type="button" disabled>정리하고 계속</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
