<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Pixelify+Sans:wght@500;700&family=Silkscreen:wght@400;700&display=swap">
<style>
body{margin:0;background:#0a0809}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;position:relative;overflow:hidden;background:radial-gradient(580px 420px at 50% 38%,rgba(255,90,50,.22),transparent 66%),#0a0809}
.stage::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(circle at 50% 40%,#000,transparent 68%);mask-image:radial-gradient(circle at 50% 40%,#000,transparent 68%)}
.torch-wrap{position:relative;width:188px;height:188px;margin-bottom:6px;animation:wrapOut 9s ease-out infinite}
.halo{position:absolute;inset:-80px;border-radius:50%;background:radial-gradient(circle,rgba(255,130,70,.6),rgba(255,70,40,.18) 45%,transparent 66%);animation:haloIn 9s ease-in-out infinite}
.torch-big{position:relative;width:188px;height:188px;animation:torchIn 9s ease-out infinite,idle 2.6s ease-in-out infinite 1.4s}
.spark{position:absolute;width:6px;height:6px;background:#ff5a3c;box-shadow:0 0 8px #ff7a50;opacity:0;animation:rise 2.2s ease-out infinite}
.word{position:relative;display:flex;gap:.04em;font-family:'Pixelify Sans','Noto Sans KR',sans-serif;font-weight:700;font-size:60px;line-height:1;letter-spacing:.07em;color:#f6ede9;filter:drop-shadow(0 0 22px rgba(255,90,50,.28));animation:wordIn 9s ease-out infinite}
.word i{font-style:normal;background:linear-gradient(180deg,#ff8a5c,#ff4a2e 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{position:relative;width:300px;height:4px;border-radius:2px;background:#2a2021;overflow:hidden;animation:barIn 9s ease-out infinite}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:left;border-radius:2px;background:linear-gradient(90deg,#c8321f,#ffb347);animation:fill 9s ease-in-out infinite}
.bar::after{content:'';position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sheen 1.6s linear infinite}
@keyframes torchIn{0%{opacity:0;transform:translateY(14px) scale(.92);filter:brightness(.35)}10%{opacity:1;transform:translateY(0) scale(1);filter:brightness(.6)}15%{filter:brightness(1.5)}20%{filter:brightness(1)}100%{opacity:1}}
@keyframes idle{0%,100%{filter:brightness(1)}40%{filter:brightness(1.12)}70%{filter:brightness(.94)}}
@keyframes wrapOut{0%,86%{opacity:1;transform:scale(1)}94%{opacity:0;transform:scale(1.08)}100%{opacity:0}}
@keyframes haloIn{0%,6%{opacity:0;transform:scale(.7)}16%{opacity:1;transform:scale(1.05)}86%{opacity:.9;transform:scale(1)}90%{opacity:1;transform:scale(1.5)}96%,100%{opacity:0;transform:scale(1.7)}}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-120px)}}
@keyframes wordIn{0%,10%{opacity:0;transform:translateY(12px)}20%{opacity:1;transform:translateY(0)}86%{opacity:1}94%{opacity:0;transform:translateY(-6px)}100%{opacity:0}}
@keyframes barIn{0%,14%{opacity:0}20%{opacity:1}86%{opacity:1}94%,100%{opacity:0}}
@keyframes fill{0%,16%{transform:scaleX(0)}30%{transform:scaleX(.62)}60%{transform:scaleX(.8)}80%{transform:scaleX(.9)}86%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@keyframes sheen{0%{left:-60px}100%{left:300px}}
</style>
</helmet>
<div class="win">
  <div class="titlebar">
    <img src="/_blob/f96edd2ab5aef7942ed20b1751f4d580" alt="">
    <span>TorchLauncher</span>
    <span class="spacer"></span>
    <button class="wc" type="button" aria-label="최소화"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="wc" type="button" aria-label="최대화"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/></svg></button>
    <button class="wc close" type="button" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="stage">
    <div class="torch-wrap">
      <div class="halo"></div>
      <img class="torch-big" src="/_blob/f96edd2ab5aef7942ed20b1751f4d580" alt="TorchLauncher 레드스톤 토치">
      <span class="spark" style="left: 112px; top: 30px; --dx: 18px; animation-delay: 1.2s"></span>
      <span class="spark" style="left: 86px; top: 36px; --dx: -22px; animation-delay: 2.1s"></span>
      <span class="spark" style="left: 124px; top: 46px; --dx: 34px; animation-delay: 3.0s"></span>
      <span class="spark" style="left: 74px; top: 48px; --dx: -40px; animation-delay: 3.9s"></span>
      <span class="spark" style="left: 100px; top: 28px; --dx: 8px; animation-delay: 4.8s"></span>
    </div>
    <div class="word" aria-label="TorchLauncher">TORCH<i>LAUNCHER</i></div>
    <div class="bar" role="progressbar" aria-label="불러오는 중"><i></i></div>
  </div>
</div>
